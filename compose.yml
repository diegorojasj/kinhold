x-mongodb-env: &mongodb-env
  DB_HOST: ${DB_HOST:-database}
  DB_PORT: ${DB_PORT:-27017}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}

services:
  frontend-dev:
    profiles: ["DEV"]
    build:
      context: ./frontend
      dockerfile: ../containers/containerfiles/frontend.dev.containerfile
    environment:
      API_GATEWAY_URL: http://api-gateway-dev:8000
    volumes:
      - ./frontend:/app:z
      - node_modules:/app/node_modules
  frontend-prod:
    profiles: ["PROD"]
    build:
      context: ./frontend
      dockerfile: ../containers/containerfiles/frontend.prod.containerfile
    volumes:
      - web-cache:/www
  nginx:
    profiles: ["PROD"]
    image: nginx:alpine
    volumes:
      - web-cache:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      frontend-prod:
        condition: service_completed_successfully
 
  database:
    image: docker.io/library/mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  node_modules:
    driver: local
  pnpm_store:
    driver: local
  web-cache:
    driver: local