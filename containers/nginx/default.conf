# Production web server: the PWA from the shared web-cache volume, and /api on the same domain (D-01).
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Live updates are server-sent events: no buffering, long-lived connections.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # The service worker and manifest must be revalidated so app updates reach phones.
    location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
